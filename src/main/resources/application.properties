spring.application.name=SportsTracker

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.cache.period=0

# Development
spring.devtools.restart.enabled=true

# Logging
logging.level.com.sportstracker=DEBUG

# ESPN API Configuration
sportstracker.espn.site-base-url=https://site.api.espn.com/
sportstracker.espn.core-base-uri=https://sports.core.api.espn.com/

# HTTP Timeouts
sportstracker.espn.connect-timeout=5s
sportstracker.espn.read-timeout=15s